[supervisord]
nodaemon=true

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1440x900x24 -ac -nolisten tcp
user=student
priority=10
autorestart=true

[program:fluxbox]
command=/bin/sh -c 'until xdpyinfo >/dev/null 2>&1; do sleep 1; done; exec fluxbox'
user=student
priority=20
autorestart=true

[program:terminal]
command=/bin/sh -c 'until xdpyinfo >/dev/null 2>&1; do sleep 1; done; exec xterm -fa Monospace -fs 13 -geometry 100x30+20+20 -title "CN Lab - ns2 / nam / xgraph"'
directory=/work
user=student
priority=30
autorestart=true

[program:vnc]
command=/bin/sh -c 'until xdpyinfo >/dev/null 2>&1; do sleep 1; done; exec x11vnc -display :1 -forever -shared -nopw -localhost -rfbport 5900'
user=student
priority=30
autorestart=true

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
user=student
priority=40
autorestart=true
